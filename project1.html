    <script>
    (function () {
        var video     = document.getElementById('spVideo');
        var playBtn   = document.getElementById('spPlayBtn');
        var volBtn    = document.getElementById('spVolBtn');
        var volSlider = document.getElementById('spVolSlider');
        var fsBtn     = document.getElementById('spFsBtn');
        var player    = document.getElementById('spVideoPlayer');
        var timeline  = document.getElementById('spTimeline');
        var progress  = document.getElementById('spProgress');

        var PLAY_ICON    = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6V2z"/></svg>';
        var PAUSE_ICON   = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="4" height="12" rx="1"/><rect x="9" y="2" width="4" height="12" rx="1"/></svg>';
        var VOL_ICON     = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
        var MUTE_ICON    = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
        var FS_ICON      = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';
        var EXIT_FS_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>';

        var lastVolume = 1;
        var overlay = document.getElementById('spPlayOverlay');

        function syncPlay() {
            playBtn.innerHTML = video.paused ? PLAY_ICON : PAUSE_ICON;
            player.classList.toggle('is-paused', video.paused);
        }
        function togglePlay() {
            if (video.paused) { video.play(); } else { video.pause(); }
        }
        playBtn.addEventListener('click', togglePlay);
        overlay.addEventListener('click', togglePlay);
        video.addEventListener('play',  syncPlay);
        video.addEventListener('pause', syncPlay);

        function updateSliderBg(val) {
            var pct = val * 100;
            volSlider.style.background =
                'linear-gradient(to right, rgba(255,255,255,0.9) ' + pct + '%, rgba(255,255,255,0.28) ' + pct + '%)';
        }
        function syncVol() {
            var muted = video.muted || video.volume === 0;
            volBtn.innerHTML = muted ? MUTE_ICON : VOL_ICON;
            var display = muted ? 0 : video.volume;
            volSlider.value = display;
            updateSliderBg(display);
        }
        volBtn.addEventListener('click', function () {
            if (video.muted || video.volume === 0) {
                video.muted = false; video.volume = lastVolume || 1;
            } else {
                lastVolume = video.volume; video.muted = true;
            }
            syncVol();
        });
        volSlider.addEventListener('input', function () {
            var val = parseFloat(this.value);
            video.volume = val; video.muted = (val === 0);
            if (val > 0) lastVolume = val;
            updateSliderBg(val);
            volBtn.innerHTML = (val === 0) ? MUTE_ICON : VOL_ICON;
        });

        var seeking = false;
        function updateProgress() {
            if (video.duration) progress.style.width = (video.currentTime / video.duration * 100) + '%';
        }
        function seekTo(e) {
            var rect = timeline.getBoundingClientRect();
            var x = Math.max(0, Math.min(e.clientX - rect.left, rect.width));
            video.currentTime = (x / rect.width) * video.duration;
        }
        video.addEventListener('timeupdate', updateProgress);
        timeline.addEventListener('mousedown', function (e) { seeking = true; seekTo(e); });
        document.addEventListener('mousemove', function (e) { if (seeking) seekTo(e); });
        document.addEventListener('mouseup',   function ()  { seeking = false; });
        timeline.addEventListener('touchstart', function (e) { seeking = true; seekTo(e.touches[0]); }, { passive: true });
        document.addEventListener('touchmove',  function (e) { if (seeking) seekTo(e.touches[0]); },    { passive: true });
        document.addEventListener('touchend',   function ()  { seeking = false; });

        fsBtn.addEventListener('click', function () {
            if (!document.fullscreenElement) {
                (player.requestFullscreen || player.webkitRequestFullscreen).call(player);
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            }
        });
        document.addEventListener('fullscreenchange',       function () { fsBtn.innerHTML = document.fullscreenElement       ? EXIT_FS_ICON : FS_ICON; });
        document.addEventListener('webkitfullscreenchange', function () { fsBtn.innerHTML = document.webkitFullscreenElement ? EXIT_FS_ICON : FS_ICON; });

        syncPlay(); syncVol(); fsBtn.innerHTML = FS_ICON;
    }());
    </script>

    <script>
    $(function () {

        function hideHints() {
            $('.book-turn-hint').addClass('is-hidden');
        }

        var downX = 0;

        function initBook(pageW, pageH) {
            $('#flipbook').turn({
                width:        pageW * 2,
                height:       pageH,
                autoCenter:   true,
                display:      'double',
                acceleration: true,
                gradients:    true,
                elevation:    50,
                when: {
                    turned: function (e, page) {
                        syncControls(page);
                        hideHints();
                    }
                }
            });

            syncControls(1);

            $('#flipbook')
                .on('mousedown', function (e) { downX = e.pageX; })
                .on('click', function (e) {
                    if (Math.abs(e.pageX - downX) > 8) return;
                    var halfW  = $(this).width() / 2;
                    var clickX = e.pageX - $(this).offset().left;
                    if (clickX > halfW) { $(this).turn('next'); }
                    else                { $(this).turn('previous'); }
                });
        }

        var probe = new Image();

        probe.onload = function () {
            var ratio  = this.naturalHeight / this.naturalWidth;
            var stageW = document.querySelector('.book-stage').offsetWidth;
            var pageW  = Math.floor(stageW / 2);
            var pageH  = Math.floor(pageW * ratio);
            initBook(pageW, pageH);
        };

        probe.onerror = function () {
            var stageW = document.querySelector('.book-stage').offsetWidth;
            var pageW  = Math.floor(stageW / 2);
            var pageH  = Math.floor(pageW * (4 / 3));
            initBook(pageW, pageH);
        };

        probe.src = 'SeniorProject_SC_Spreads_BakingThroughImperfection.png';

        function syncControls(page) {
            var total = $('#flipbook').turn('pages');
            $('#bookPageNum').text(page + ' / ' + total);
            $('#bookPrev').prop('disabled', page <= 1);
            $('#bookNext').prop('disabled', page >= total);
            var $wrap = $('.book-hint-wrap');
            $wrap.removeClass('book-hint-wrap--cover book-hint-wrap--backcover');
            if (page <= 1)     { $wrap.addClass('book-hint-wrap--cover'); }
            if (page >= total) { $wrap.addClass('book-hint-wrap--backcover'); }
        }

        $('#bookNext').on('click', function () { $('#flipbook').turn('next'); hideHints(); });
        $('#bookPrev').on('click', function () { $('#flipbook').turn('previous'); hideHints(); });

    });
    </script>
